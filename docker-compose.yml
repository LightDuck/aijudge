services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aijudge
      POSTGRES_PASSWORD: aijudge
      POSTGRES_DB: aijudge
    ports:
      - "5433:5432"
    volumes:
      - aijudge_pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro

volumes:
  aijudge_pgdata:
